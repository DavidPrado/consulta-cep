server:
  shutdown: graceful

spring:
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=5000,expireAfterWrite=10m,recordStats
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false
  datasource:
    url: jdbc:postgresql://localhost:5438/cobertura
    username: cobertura
    password: cobertura
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    consumer:
      group-id: consulta-cep-log
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: br.com.cobertura.consulta.*

viacep:
  base-url: https://viacep.com.br/ws
  connect-timeout: 3000
  read-timeout: 5000

app:
  kafka:
    topics:
      consulta-log: consulta-log-topic
      cep-descoberto: cep-descoberto-topic
  lote:
    worker:
      intervalo-ms: 10000
      batch-size: 50
      max-tentativas: 3
      paralelismo: 20

resilience:
  circuit-breakers:
    viaCep:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-duration-in-open-state: 30s
      permitted-number-of-calls-in-half-open-state: 3