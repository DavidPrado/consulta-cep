spring:
  application:
    name: consulta-cep
  profiles:
    active: local
  jpa:
    open-in-view: false

server:
  port: 8088
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

